[project]
name = "cryptolab"
version = "1.0.0"
description = "Comparative analysis of cryptographic algorithms and vulnerability testing"
requires-python = ">=3.9"
dependencies = ["cryptography>=42.0"]

[project.scripts]
cryptolab = "cryptolab.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
